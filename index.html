<!DOCTYPE html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, viewport-fit=cover" />
    <title>F&amp;M Health &amp; Wellness — Medical Billing &amp; Clinical Platform</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏥</text></svg>" />
    <!-- Fonts matching Google Stitch export -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-surface text-on-surface antialiased font-sans">
    <script>
      window.addEventListener('error', e => { 
        document.body.innerHTML = '<div style="padding:20px;color:red;font-size:20px;font-family:sans-serif"><h1>Global Error</h1><pre>' + (e.error ? e.error.stack : e.message) + '</pre></div>'; 
      }); 
      window.addEventListener('unhandledrejection', e => { 
        document.body.innerHTML = '<div style="padding:20px;color:red;font-size:20px;font-family:sans-serif"><h1>Unhandled Promise Rejection</h1><pre>' + (e.reason && e.reason.stack ? e.reason.stack : e.reason) + '</pre></div>'; 
      });

      // MONKEY PATCH TO FIX REACT CRASHES FROM GOOGLE TRANSLATE
      if (typeof Node === 'function' && Node.prototype) {
        const originalRemoveChild = Node.prototype.removeChild;
        Node.prototype.removeChild = function(child) {
          if (child.parentNode !== this) {
            console.warn('Google Translate React Fix: Ignored removeChild on wrong parent.');
            return child;
          }
          return originalRemoveChild.apply(this, arguments);
        };
        const originalInsertBefore = Node.prototype.insertBefore;
        Node.prototype.insertBefore = function(newNode, referenceNode) {
          if (referenceNode && referenceNode.parentNode !== this) {
            console.warn('Google Translate React Fix: Ignored insertBefore on wrong parent.');
            return newNode;
          }
          return originalInsertBefore.apply(this, arguments);
        };
      }
    </script>
    
    <!-- Google Translate Hidden Widget -->
    <div id="google_translate_master_container" style="display:none;"></div>
    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement({
          pageLanguage: 'en',
          includedLanguages: 'en,fr,es',
          autoDisplay: false
        }, 'google_translate_master_container');
      }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
